<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff 0%, #f8f9fa 55%, #e8f6f3 100%);
        }

        .signin-card {
            max-width: 440px;
            border: 0;
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #0d6efd;
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">my website</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarnav"
                aria-controls="navbarnav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarnav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">about</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">site</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">webpage</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card signin-card shadow-lg rounded-3 mx-auto">
                    <div class="card-body p-4 p-sm-5">
                        <div class="text-center mb-4">
                            <div class="brand-mark mx-auto mb-3" aria-hidden="true">W</div>
                            <h1 class="h3 mb-2">Welcome back</h1>
                            <p class="text-muted mb-0">Sign in to continue to My Website</p>
                        </div>

                        <form id="signinForm" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control form-control-lg" id="email"
                                    placeholder="you@example.com" autocomplete="email" required>
                                <div class="invalid-feedback">Please enter a valid email address.</div>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label for="password" class="form-label">Password</label>
                                    <a class="small text-decoration-none" href="#forgot-password">Forgot password?</a>
                                </div>
                                <div class="input-group input-group-lg">
                                    <input type="password" class="form-control" id="password"
                                        placeholder="Enter your password" autocomplete="current-password" minlength="6" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                        aria-label="Show password">Show</button>
                                    <div class="invalid-feedback">Password must be at least 6 characters.</div>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>

                            <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
                        </form>

                        <p class="text-center text-muted mt-4 mb-0">
                            New here? <a href="#create-account" class="text-decoration-none">Create an account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script>
        const signInForm = document.getElementById('signinForm');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.textContent = isPassword ? 'Hide' : 'Show';
            togglePassword.setAttribute('aria-label', `${isPassword ? 'Hide' : 'Show'} password`);
        });

        signInForm.addEventListener('submit', (event) => {
            event.preventDefault();
            signInForm.classList.add('was-validated');

            if (signInForm.checkValidity()) {
                alert('Sign-in details are valid. Connect this form to your authentication service.');
            }
        });
    </script>
</body>

</html>
